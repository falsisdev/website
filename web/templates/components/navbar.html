{{define "navbar"}}
<header class="sticky top-0 z-50 border-b border-zinc-800/80 bg-zinc-950/75 backdrop-blur-md">
  <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-4">
    <div class="flex items-center gap-6">
      <a href="/" class="font-semibold text-zinc-100">{{.Brand}}</a>
      <nav class="hidden items-center gap-5 text-sm text-zinc-300 md:flex">
        <a href="#about" class="hover:text-white">About</a>
        <a href="#projects" class="hover:text-white">Projects</a>
        <a href="#blog" class="hover:text-white">Blog</a>
        <a href="#contact" class="hover:text-white">Contact</a>
      </nav>
    </div>

    <label class="flex items-center gap-2 text-sm text-zinc-400">
      <span>{{.LanguageLabel}}</span>
      <select
        name="lang"
        class="rounded border border-zinc-700 bg-zinc-900 px-2 py-1 text-zinc-100 outline-none focus:border-white"
        hx-get="/"
        hx-trigger="change"
        hx-target="#page-shell"
        hx-swap="outerHTML"
        hx-include="this"
        aria-label="{{.LanguageLabel}}"
      >
        <option value="en" {{if eq .Language "en"}}selected{{end}}>English</option>
        <option value="tr" {{if eq .Language "tr"}}selected{{end}}>Türkçe</option>
      </select>
    </label>
  </div>
</header>
{{end}}
