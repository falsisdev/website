{{define "navbar"}}
<header
  class="border-b border-zinc-800/80 bg-zinc-950/50 backdrop-blur-md sticky top-0 z-50"
>
  <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
    <a href="/" class="font-semibold text-zinc-100">{{.Brand}}</a>

    <label class="flex items-center gap-2 text-sm text-zinc-400">
      <span>{{.LanguageLabel}}</span>
      <select
        name="lang"
        class="rounded border border-zinc-700 bg-zinc-900 px-2 py-1 text-zinc-100 outline-none focus:border-violet-400"
        hx-get="/"
        hx-trigger="change"
        hx-target="#page-shell"
        hx-swap="outerHTML"
        hx-include="this"
        aria-label="{{.LanguageLabel}}"
      >
        <option value="en" {{if eq .Language "en"}}selected{{end}}>English</option>
        <option value="tr" {{if eq .Language "tr"}}selected{{end}}>Türkçe</option>
      </select>
    </label>
  </div>
</header>
{{end}}
